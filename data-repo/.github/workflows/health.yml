name: Health sync

on:
  repository_dispatch:
    types: [health]

permissions:
  contents: write

# No concurrency group on purpose. GitHub drops queued runs in a group,
# and backfill sends many events. Each run retries from origin/main instead.

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: atomic-days/habits
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Import and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            node app/health-import/cli.ts
            sentAt=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).client_payload.sentAt)')
            git add data/health
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Health sync $sentAt"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt $attempt, resetting to origin/main"
            if ! { git fetch origin main && git reset --hard origin/main; }; then
              # Drop this attempt's commit so the next attempt rebuilds and recommits it.
              # Otherwise it finds nothing staged and exits 0 with the commit unpushed.
              git reset --hard HEAD~1
            fi
            sleep $((RANDOM % 9 + 2))
          done
          echo "Giving up after 5 attempts"
          exit 1
